# ============================================
# WORKFLOW FILE: 00-complete-ci-cd.yml
# PURPOSE: Complete CI/CD pipeline with ALL steps in ONE workflow
# This ensures: Build → Test → Quality → Docker (sequential)
# ============================================

# Name shown in GitHub Actions UI
name: Complete CI/CD Pipeline

# ============================================
# TRIGGER SECTION
# ============================================
# Runs when code is pushed to main branch
on:
  push:
    branches: [ main ]

# ============================================
# ENVIRONMENT VARIABLES
# ============================================
env:
  GO_VERSION: '1.25'
  APP_NAME: my-go-api
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

# ============================================
# JOBS SECTION
# ============================================
jobs:

  # ========================================
  # JOB 1: Build
  # ========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Step 3: Download dependencies
      - name: Download dependencies
        run: go mod download

      # Step 4: Build the application
      - name: Build application
        run: go build -v ./...

  # ========================================
  # JOB 2: Test (depends on: build)
  # ========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build  # ← WAIT for build to complete first!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

  # ========================================
  # JOB 3: Code Quality (depends on: test)
  # ========================================
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: test  # ← WAIT for tests to complete first!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      # Quality Check 1: gofmt
      - name: Check code formatting
        run: |
          echo "=== Checking code format with gofmt ==="
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "❌ Files need formatting:"
            echo "$output"
            exit 1
          else
            echo "✅ Code is properly formatted"
          fi

      # Quality Check 2: go vet
      - name: Run go vet
        run: go vet ./...

      # Quality Check 3: Tests with coverage
      - name: Run tests with coverage
        run: |
          go test -v -cover ./...
          echo ""
          echo "=== Coverage Report ==="
          go test -cover ./...

  # ========================================
  # JOB 4: Docker Build (depends on: quality)
  # ========================================
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality  # ← WAIT for quality checks to complete first!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ github.sha }}

      - name: Verify image pushed
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "Image: ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ github.sha }}"

# ============================================
# HOW IT WORKS
# ============================================
#
# 1. BUILD → Runs first
#    If it FAILS → Pipeline stops here
#    If it PASSES → Move to TEST
#
# 2. TEST → Runs after BUILD passes
#    If it FAILS → Pipeline stops here
#    If it PASSES → Move to QUALITY
#
# 3. QUALITY → Runs after TEST passes
#    If it FAILS → Pipeline stops here
#    If it PASSES → Move to DOCKER
#
# 4. DOCKER → Runs after QUALITY passes
#    Builds and pushes image
#
# VISUAL FLOW:
# ┌────────┐
# │ BUILD  │ → If fail, stop!
# └────┬───┘
#      ↓
# ┌────────┐
# │  TEST  │ → If fail, stop!
# └────┬───┘
#      ↓
# ┌────────┐
# │QUALITY │ → If fail, stop!
# └────┬───┘
#      ↓
# ┌────────┐
# │ DOCKER │ → Done! Image pushed!
# └────────┘
#
# ============================================
